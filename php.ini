; php.ini personalizado para el proyecto cmsdigital
; --------------------------
; Instrucciones:
; - En cPanel MultiPHP INI Editor -> Editor: pega el contenido de este archivo.
; - No sobrescribas la línea disable_functions si tu hosting requiere funciones particulares:
;   cuando adaptes la lista, QUITA highlight_file y show_source para evitar el error de Symfony.
; - Después de aplicar en producción: reinicia PHP/Apache o pide al proveedor que aplique los cambios.
; - En XAMPP Windows: mejor editar el php.ini de la instalación de PHP (por ejemplo C:\xampp\php\php.ini)
; --------------------------

;;;;;;;;;;;;;;;;;;;;;;;
; Basic Settings
;;;;;;;;;;;;;;;;;;;;;;;
; Charset
default_charset = "UTF-8"

; Timezone
date.timezone = "America/Argentina/Buenos_Aires"

; Error reporting
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "${sys_temp_dir}/php-error.log"

; File uploads
file_uploads = On
upload_max_filesize = 40M
post_max_size = 50M
max_file_uploads = 20

; Memory and execution
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Opcache (si está disponible) - ayuda en rendimiento
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.revalidate_freq=2

;;;;;;;;;;;;;;;;;;;;;;;
; Session
;;;;;;;;;;;;;;;;;;;;;;;
session.gc_maxlifetime = 7200
session.cookie_secure = 0
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

;;;;;;;;;;;;;;;;;;;;;;;
; Security (disable functions)
;;;;;;;;;;;;;;;;;;;;;;;
; RECOMENDACIÓN: Mantener deshabilitadas funciones peligrosas, pero NO incluir highlight_file ni show_source
; ya que Symfony las usa para mostrar errores en modo debug. Ajusta según políticas de tu hosting.
; Ejemplo seguro (quita o añade funciones según tu necesidad):
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

;;;;;;;;;;;;;;;;;;;;;;;
; File system / streams
;;;;;;;;;;;;;;;;;;;;;;;
realpath_cache_size = 4096k
realpath_cache_ttl = 300

;;;;;;;;;;;;;;;;;;;;;;;
; Intl / mbstring
;;;;;;;;;;;;;;;;;;;;;;;
mbstring.language = Neutral
mbstring.internal_encoding = UTF-8
mbstring.http_input = auto
mbstring.http_output = UTF-8

;;;;;;;;;;;;;;;;;;;;;;;
; Misc
;;;;;;;;;;;;;;;;;;;;;;;
allow_url_fopen = On
allow_url_include = Off

; Increase default socket timeout
default_socket_timeout = 60

;;;;;;;;;;;;;;;;;;;;;;;
; Notes
;;;;;;;;;;;;;;;;;;;;;;;
; - Si tu hosting no permite editar disable_functions desde cPanel, pide al proveedor que quite
;   highlight_file y show_source, o aplica el fallback temporal que añadimos en public/index.php
; - Si tienes problemas con tildes/acentos en BD, asegúrate también de que:
;     - MySQL uses utf8mb4 charset and collation utf8mb4_unicode_ci for database/tables/columns
;     - APP_CHARSET y APP_LOCALE en .env estén correctos
; - Para producción recuerda poner `display_errors = Off` y `APP_DEBUG=false` en .env

; fin de php.ini personalizado
